# Keep the ANVESHAK demo awake on Streamlit Community Cloud.
#
# Community Cloud suspends an app that receives no viewer traffic, and nothing
# inside app.py can prevent that -- the sleep is decided by the host, not the
# process. The only thing that resets the timer is a request arriving from
# outside, so this workflow sends one on a schedule.
#
# SETUP (one time): add the app URL as a repository variable named
# STREAMLIT_APP_URL under Settings > Secrets and variables > Actions > Variables.
# Without it the job is skipped rather than failing, so a fork does not get
# red runs it cannot fix.
#
# CAVEAT worth knowing before a demo: GitHub disables scheduled workflows in a
# repository with no commits for 60 days, and re-enables them only on a manual
# push. If ANVESHAK has to be awake on a specific day, run this workflow by
# hand that morning as well -- the schedule is a convenience, not a guarantee.

name: Keep demo awake

on:
  schedule:
    # Every six hours. Community Cloud's inactivity window is longer than this,
    # so four pings a day leaves room for two consecutive failures.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the demo
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "STREAMLIT_APP_URL is not set; nothing to ping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi

          # A sleeping app answers the first request slowly while it wakes, so
          # a short timeout would report failure exactly when the ping worked.
          # Three attempts, generous timeout, and only then call it down.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                        --max-time 90 --retry 0 "$APP_URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Demo is awake."
              exit 0
            fi
            sleep 20
          done

          echo "::error::$APP_URL did not return 200 after three attempts."
          echo "The app may have been suspended for longer than a ping can fix;"
          echo "open it once in a browser to wake it, then this schedule holds it."
          exit 1
