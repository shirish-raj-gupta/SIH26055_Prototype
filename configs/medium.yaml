# MEDIUM tier — 15 emitters, mixed, 2 agile. THE HEADLINE BENCHMARK (acceptance test 3).
# Target: a learned scheduler beats SequentialSweep by >=25% median TTFI and >=15% TWIR,
#         over 30 paired seeds with 95% bootstrap CIs.
extends: base.yaml

run:
  name: medium
  n_seeds: 30

scenario:
  difficulty: medium
  n_emitters: 15
  mix:
    fixed_cw: 3
    pulsed_radar: 4
    circular_scan: 3        # <- the scan-on-scan targets; where our gain comes from
    sector_scan: 1
    frequency_agile: 2      # <- "2 agile" per the PS
    agile_beam: 1
    comms_burst: 1
    interferer: 0
  n_popup: 0

emitters:
  circular_scan:
    # 1-5 s gives 2-10 revolutions in a 10 s episode. The PS range is [1, 12] s,
    # but a 12 s scanner illuminates us at most once in 10 s, which is a censored
    # observation rather than a scheduling problem. HARD keeps the full range.
    scan_period_s: [2.0, 6.0]
    # Narrower beams than the full PS range: with a 96-slot sweep, a 1-3 deg beam
    # gives a 13-120 ms illumination window, which straddles the sweep period and
    # so genuinely tests whether a scheduler can be in the right place in time.
    # HARD keeps the full [1, 6] deg range.
    beamwidth_deg: [1.0, 3.0]

rl:
  total_steps: 1000000

predictor:
  epochs: 40

eval:
  agents: [sequential, random, priority_rr, epsilon_greedy, ucb1, thompson,
           whittle, coprime_sweep, phase_locked, predictor, dqn, ppo, hybrid]
