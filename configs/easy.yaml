# EASY tier — 5 static emitters. The live-demo config: must run end-to-end in <10 min CPU.
# NOTE: SequentialSweep is near-optimal against static emitters (architecture.md §17-C).
#       We do not expect a large win here, and we say so rather than manufacturing one.
extends: base.yaml

run:
  name: easy

scenario:
  difficulty: easy
  n_emitters: 5
  mix:
    fixed_cw: 3
    pulsed_radar: 2
    circular_scan: 0
    sector_scan: 0
    frequency_agile: 0
    agile_beam: 0
    comms_burst: 0
    interferer: 0
  n_popup: 0

rl:
  # 200k was enough for plain PPO but not for the hybrid, whose observation is
  # a plane wider (B*13 + G against B*12 + G). At 200k the hybrid collapsed to
  # a single channel under greedy inference -- coverage 0.000, TWIR 0.0000 --
  # while its training return of 62.4 looked merely mediocre. See
  # `Known limitations` in the README.
  total_steps: 600000
  hybrid:
    # Hybrid ONLY -- plain PPO trains fine at the shared 0.01 and must not be
    # changed by this. Raised because the hybrid drives its entropy to 0.362
    # mid-run and then locks onto one channel under greedy evaluation. This
    # buys a non-degenerate policy, not a good one: the result sits near
    # uniform and behaves close to randomly.
    entropy_coef: 0.03

predictor:
  epochs: 20

# EASY inherited base's 7-agent list, which predates the learned schedulers
# being trainable. All four now have EASY checkpoints -- and predictor_easy is
# the strongest predictor in the project (AUC 0.911, 20.6x AP lift over the
# base rate) -- so leaving them out meant the tier's own best model never
# appeared in its own leaderboard.
#
# coprime_sweep and phase_locked are included for comparison even though EASY
# has no scanning radars for them to lock onto: a scan-on-scan policy showing
# no advantage where there is nothing to scan against is a useful control, not
# a wasted row.
eval:
  agents: [sequential, random, priority_rr, epsilon_greedy, ucb1, thompson,
           whittle, coprime_sweep, phase_locked, predictor, dqn, ppo, hybrid]
